<div class="modal-overlay" id="videoModal" onclick="closeModal(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModalBtn()">[ ESC ] CLOSE</button>
    <div class="modal-video"><iframe id="modalIframe" src="" allowfullscreen allow="autoplay"></iframe></div>
  </div>
</div>

<script src="lang.js"></script>
<script>
const VIDEOS=[
  {id:'R9sQVe0I_zg',vol:'VOL. 01',title:'Deep Ambient — Neon Megacity 2250',tag:'DEEP FOCUS'},
  {id:'h2vHzrmb-bY',vol:'VOL. 02',title:'Cosmic Soundscape — Interstellar Horizons',tag:'COSMIC AMBIENT'},
  {id:'Ahl2LXtIJKs',vol:'VOL. 03',title:'AI World — Smart City at Dawn',tag:'SCI-FI 2250'},
  {id:'km-jJqYV3Qc',vol:'VOL. 04',title:'Future Earth — Organic Architecture',tag:'SOLARPUNK'},
  {id:'cLlIns684Xc',vol:'VOL. 05',title:'Starfield Drift — Beyond the Galaxy',tag:'INTERSTELLAR'},
  {id:'S6C7OeuMPmc',vol:'VOL. 06',title:'Neon Rain — Cyberpunk Metropolis',tag:'CYBERPUNK'},
  {id:'FWtclKfCWGs',vol:'VOL. 07',title:'Silent Protocol — AI Consciousness',tag:'DEEP FOCUS'},
  {id:'YcRmvb8ico8',vol:'VOL. 10',title:'Megacity Loop — Urban Infinity',tag:'CITY 2250'},
];
function buildVideos(){
  const grid=document.getElementById('vgrid');
  VIDEOS.forEach(v=>{
    const c=document.createElement('div');c.className='video-card';c.onclick=()=>openModal(v.id);
    c.innerHTML=`<div class="video-thumb"><img src="https://img.youtube.com/vi/${v.id}/maxresdefault.jpg" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'"><div class="play-overlay"><div class="play-btn">▶</div></div></div><div class="video-meta"><div class="video-vol">${v.vol}</div><div class="video-title">${v.title}</div><span class="vtag">${v.tag}</span></div>`;
    grid.appendChild(c);
  });
}
function openModal(id){document.getElementById('modalIframe').src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;document.getElementById('videoModal').classList.add('open');document.body.style.overflow='hidden';}
function closeModalBtn(){document.getElementById('modalIframe').src='';document.getElementById('videoModal').classList.remove('open');document.body.style.overflow='';}
function closeModal(e){if(e.target===document.getElementById('videoModal'))closeModalBtn();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalBtn();});
buildVideos();
initLang();
</script>
